name: release

on:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  version:
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Look for changesets
        id: changesets
        run: |
          if find .changeset -maxdepth 1 -name '*.md' ! -name README.md | grep -q .; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "no changeset is waiting, so there is no version to prepare"
          fi
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        if: steps.changesets.outputs.found == 'true'
        with:
          bun-version: "1.4.5"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        if: steps.changesets.outputs.found == 'true'
        with:
          node-version: "24"
      - if: steps.changesets.outputs.found == 'true'
        run: bun install --frozen-lockfile
      - name: Open or update the version pull request
        if: steps.changesets.outputs.found == 'true'
        uses: changesets/action/version@ae32849d5ba541f9ae29e40e22a623bc13562f51
        with:
          script: bun run version-packages
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"

  publish:
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: npm-tarballs
          path: ${{ runner.temp }}/tarballs
      - name: Publish the platform packages, then the main package
        working-directory: ${{ runner.temp }}/tarballs
        run: |
          set -euo pipefail
          needed=11.5.1
          have="$(npm --version)"
          if [ "$(printf '%s\n%s\n' "$needed" "$have" | sort -V | head -n 1)" != "$needed" ]; then
            echo "npm $have is older than $needed, which trusted publishing needs" >&2
            exit 1
          fi
          for tarball in kerpetensh-kerpeten-*.tgz kerpeten-*.tgz; do
            name="$(tar -xOf "$tarball" package/package.json | jq -r .name)"
            version="$(tar -xOf "$tarball" package/package.json | jq -r .version)"
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already published"
            else
              npm publish "$tarball" --access public
            fi
          done

  github-release:
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Create the GitHub release of a version that has none
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(jq -r .version package.json)"
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "the release v$version is already there"
            exit 0
          fi
          if [ ! -f CHANGELOG.md ]; then
            echo "there is no CHANGELOG.md yet, so v$version gets no release"
            exit 0
          fi
          notes="$RUNNER_TEMP/notes.md"
          awk -v heading="## $version" '$0 == heading { on = 1; next } on && /^## / { exit } on { print }' CHANGELOG.md > "$notes"
          if ! grep -q '[^[:space:]]' "$notes"; then
            echo "CHANGELOG.md has no section for $version, so v$version gets no release"
            exit 0
          fi
          gh release create "v$version" --target "$GITHUB_SHA" --title "v$version" --notes-file "$notes"
